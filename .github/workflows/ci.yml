name: ci
# Vercel builds every push; this adds the checks a build doesn't run.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dashboard kit copy is untouched (components/kit is synced, never edited)
        run: npm run kit:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Lint of the code under the dashboard standard (the kitLint ratchet)
        run: npm run lint:dashboard
